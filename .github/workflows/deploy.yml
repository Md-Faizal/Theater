name: 🚀 Deploy Threater (Virtual Cinema)

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - '.vscode/**'
      - '.editorconfig'

  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry Run (Verify SSH & check config without touching live services)'
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: threater-production-deploy
  cancel-in-progress: false

jobs:
  build-and-verify:
    name: ⚡ Fast Cached Build & Test
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: ⚙️ Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: 📦 Install & Build Frontend
        env:
          BASE_URL: /fun/
        run: |
          npm --prefix client ci
          npm --prefix client run build

      - name: 🦀 Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          components: rustfmt, clippy

      - name: ⚡ Cache Rust Cargo Dependencies & Target
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: server -> target

      - name: 🔍 Cargo Verification & Release Compilation
        run: |
          cargo fmt --manifest-path server/Cargo.toml -- --check
          cargo test --manifest-path server/Cargo.toml
          cargo build --release --manifest-path server/Cargo.toml
          mkdir -p bin
          cp target/release/virtual-cinema-server bin/
          strip bin/virtual-cinema-server

      - name: 📦 Upload Compiled Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: threater-build-artifacts
          path: |
            bin/virtual-cinema-server
            client/dist
          retention-days: 1

  deploy-production:
    name: 🚀 Deploy to Production Host
    needs: [build-and-verify]
    runs-on: ubuntu-latest
    env:
      SSH_HOST: ${{ secrets.COS_SSH_HOST || secrets.SSH_HOST || secrets.DEPLOY_HOST }}
      SSH_USER: ${{ secrets.COS_SSH_USER || secrets.SSH_USER || secrets.DEPLOY_USER || 'ubuntu' }}
      SSH_KEY: ${{ secrets.COS_SSH_KEY || secrets.SSH_KEY || secrets.DEPLOY_KEY }}
      TARGET_DIR: ${{ secrets.DEPLOY_TARGET_DIR || '/home/ubuntu/stack/apps/threater' }}
      PUBLIC_URL: ${{ secrets.PUBLIC_APP_URL || 'https://faizal.uk/fun' }}
      DRY_RUN: ${{ github.event.inputs.dry_run || false }}
    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 📥 Download Precompiled Artifacts
        uses: actions/download-artifact@v4
        with:
          name: threater-build-artifacts
          path: ./

      - name: 🔍 Inspect Downloaded Artifacts
        run: |
          ls -la bin/
          ls -la client/dist/

      - name: 🔍 Verify Deployment Secrets
        run: |
          echo "Verifying deployment credentials..."
          ERRORS=0
          if [ -z "$SSH_HOST" ]; then
            echo "❌ ERROR: SSH_HOST secret is missing!"
            ERRORS=$((ERRORS + 1))
          fi
          if [ -z "$SSH_USER" ]; then
            echo "❌ ERROR: SSH_USER secret is missing!"
            ERRORS=$((ERRORS + 1))
          fi
          if [ -z "$SSH_KEY" ]; then
            echo "❌ ERROR: SSH_KEY secret is missing!"
            ERRORS=$((ERRORS + 1))
          fi
          if [ $ERRORS -gt 0 ]; then
            exit 1
          fi
          echo "✅ All deployment credentials present."

      - name: 🔌 Setup SSH & Deploy
        run: |
          set -euo pipefail

          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          if echo "$SSH_KEY" | grep -q "^LS0t"; then
            echo "$SSH_KEY" | base64 -d > ~/.ssh/deploy_key
          elif echo "$SSH_KEY" | grep -q "BEGIN"; then
            echo "$SSH_KEY" | tr -d '\r' > ~/.ssh/deploy_key
          else
            echo "$SSH_KEY" | base64 -d > ~/.ssh/deploy_key 2>/dev/null || echo "$SSH_KEY" > ~/.ssh/deploy_key
          fi
          chmod 600 ~/.ssh/deploy_key

          cat << 'EOF' > ~/.ssh/config
          Host production
            HostName ${{ env.SSH_HOST }}
            User ${{ env.SSH_USER }}
            IdentityFile ~/.ssh/deploy_key
            Port 22
            StrictHostKeyChecking no
            UserKnownHostsFile /dev/null
            ServerAliveInterval 30
            ServerAliveCountMax 5
          EOF
          chmod 600 ~/.ssh/config

          echo "🛡️ Ensuring target directories on remote host..."
          ssh production "sudo chown -R \$(id -u):\$(id -g) $TARGET_DIR 2>/dev/null || true && mkdir -p $TARGET_DIR/data && touch $TARGET_DIR/.env && chmod -R u+rwX $TARGET_DIR 2>/dev/null || true"

          if [ "$DRY_RUN" = "true" ]; then
            echo "🔍 DRY RUN: Build and SSH verified. Exiting."
            exit 0
          fi

          echo "📦 Syncing prebuilt binary, client dist, and Docker files via rsync..."
          rsync -avz --delete \
            --exclude='/data/*.db*' \
            --exclude='/data/backups' \
            --exclude='/.git' \
            --exclude='/.env' \
            --exclude='/client/node_modules' \
            --exclude='/client/src' \
            --exclude='/server' \
            --exclude='/target' \
            ./ production:"$TARGET_DIR/"

          echo "🔄 Instantly building runtime container (< 5s) and restarting service..."
          ssh production bash -s << REMOTESCRIPT
          set -e
          cd "${{ env.TARGET_DIR }}"

          docker compose build --pull
          docker compose down --remove-orphans || true
          docker compose up -d

          echo "⏳ Waiting for health check..."
          for i in \$(seq 1 15); do
            if curl -fsS http://127.0.0.1:3030/health > /dev/null 2>&1; then
              echo "✅ Threater is healthy on port 3030 (after \$i s)!"
              exit 0
            fi
            sleep 2
          done

          echo "❌ Container healthcheck timed out"
          docker compose logs --tail 50
          exit 1
          REMOTESCRIPT

          echo "======================================================"
          echo "🎉 Threater Production Deployment Complete!"
          echo "======================================================"

      - name: ✅ Smoke Test Live Public Endpoint
        if: ${{ env.DRY_RUN != 'true' && env.PUBLIC_URL != '' }}
        run: |
          echo "⏳ Verifying live public endpoint ${{ env.PUBLIC_URL }}/..."
          SUCCESS=false
          for i in $(seq 1 15); do
            HTTP=$(curl -s -o /dev/null -w "%{http_code}" -m 5 "${{ env.PUBLIC_URL }}/" || echo "000")
            if [ "$HTTP" = "200" ]; then
              SUCCESS=true
              echo "✅ Endpoint ${{ env.PUBLIC_URL }}/ is live and serving HTTP 200 (after ${i}s)!"
              break
            fi
            sleep 2
          done
          if [ "$SUCCESS" != "true" ]; then
            echo "❌ Smoke test FAILED after 30s (HTTP: $HTTP)"
            exit 1
          fi
