services:
  # ============================================================================
  # All-in-One Production Deployment (Client + Server + SQLite)
  # ============================================================================
  threater:
    build:
      context: .
      dockerfile: Dockerfile
    image: threater:latest
    container_name: threater-app
    restart: unless-stopped
    network_mode: host
    env_file:
      - path: .env
        required: false
    environment:
      - THREATER_ADDR=${THREATER_ADDR:-0.0.0.0:3030}
      - DATABASE_URL=${DATABASE_URL:-sqlite:///app/data/threater.db}
      - CLIENT_DIST=${CLIENT_DIST:-/app/client/dist}
      - THREATER_DEV_AUTH=${THREATER_DEV_AUTH:-false}
      - THREATER_COOKIE_SECURE=${THREATER_COOKIE_SECURE:-true}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID:-}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET:-}
      - RUST_LOG=${RUST_LOG:-info}
    volumes:
      - ${THREATER_DATA_PATH:-./data}:/app/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:3030/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 384M
        reservations:
          memory: 64M
    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "2"

