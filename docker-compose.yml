services:
  # ============================================================================
  # All-in-One Production Deployment (Client + Server + SQLite)
  # Matches ~/stack conventions across cos and my-mac
  # ============================================================================
  threater:
    build:
      context: .
      dockerfile: Dockerfile
    image: threater:latest
    container_name: threater-app
    restart: unless-stopped
    network_mode: host
    environment:
      - THREATER_ADDR=0.0.0.0:3030
      - DATABASE_URL=sqlite:///app/data/threater.db
      - CLIENT_DIST=/app/client/dist
      - THREATER_DEV_AUTH=true
      - THREATER_COOKIE_SECURE=false
      - RUST_LOG=info
    volumes:
      - /home/ubuntu/stack/apps/threater/data:/app/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:3030/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 384M
        reservations:
          memory: 64M
    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "2"
